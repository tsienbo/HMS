<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Hospital Management System</title>
</head>
<body>
    <div class="topbar">
        <!-- wrapper 这个盒子用于 flex 父盒子，以取代 inline-block -->
        <div class="wrapper">
            <div class="brand">
                <div>医院挂号管理系统
                    <small>Hospital Management System</small>
                </div>
            </div>
            <nav class="nav">
                <button id="index">首页</button>
                <button id="appointment">预约挂号</button>
                <button id="my_appointments">我的挂号</button>
            </nav>

        </div>
    </div>

    <main class="container">
        <!-- 列数由 CSS 的 auto-fill + minmax 自动决定，这里不用管 -->
        <div class="quick-grid">
            <button class="quick-btn">
                <span class="icon">🫀</span>
                <span class="label">内科</span>
            </button>
            <button class="quick-btn">
                <span class="icon">💊</span>
                <span class="label">外科</span>
            </button>
            <button class="quick-btn">
                <span class="icon">🧒</span>
                <span class="label">儿科</span>
            </button>
            <button class="quick-btn">
                <span class="icon">🦴</span>
                <span class="label">骨科</span>
            </button>
            <button class="quick-btn">
                <span class="icon">👁️</span>
                <span class="label">眼科</span>
            </button>
            <button class="quick-btn">
                <span class="icon">👶</span>
                <span class="label">产科</span>
            </button>
            <button class="quick-btn">
                <span class="icon">🌸</span>
                <span class="label">妇科</span>
            </button>
            <button class="quick-btn">
                <span class="icon">🩺</span>
                <span class="label">皮肤科</span>
            </button>
        </div>

    </main>

    <script src="./js/main.js"></script>
</body>
</html>
